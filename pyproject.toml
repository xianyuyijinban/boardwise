[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardwise"
version = "0.1.0"
description = "AI harness for EasyEDA Pro: rule-driven offline design review (stage 1), generation and simulation on the roadmap."
readme = "README.md"
requires-python = ">=3.10"
# The only runtime dependency. `boardwise bridge` speaks WebSocket to the
# connector extension; everything else is standard library by design, so the
# offline review path stays installable anywhere.
# The `websockets.asyncio.*` API used by the daemon landed in 13.0; developed
# and tested against 17.1.
dependencies = ["websockets>=13.0"]

# Test-only extras (issue #2). The suite is this project's second line of
# defence (AGENTS.md: pytest / connector `npm test` / `tsc`), but pytest was
# only ever configured here -- in `[tool.pytest.ini_options]`, which is
# configuration, not a dependency -- so a fresh clone could finish
# `scripts/install.bat` and still have no pytest to run it with. A development
# machine installs itself with `pip install -e ".[dev]"`.
#
# `pyinstaller` rides along since 028 batch 3a: it builds the single-file
# `boardwise.exe` (`packaging/build_exe.py`), it is needed by nobody at runtime,
# and leaving it out would make the release artifact reproducible only on the one
# machine where it happens to be installed by hand.
[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.0"]

[project.scripts]
boardwise = "boardwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Only the real suite. `tools/eprj2-recon/` is a lab notebook of one-off probe
# scripts (they need pycryptodome and a sample .eprj2); its files must not be
# collected just because they are named `*_test.py`.
testpaths = ["tests"]
